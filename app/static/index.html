<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E5F5B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>BillPay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="auth" hidden></div>
  <div class="shell" id="shell" hidden>
    <nav class="nav" aria-label="Main">
      <div class="brand">BillPay</div>
      <a href="#/" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 4h18v16H3zM3 9h18M8 4v5M16 4v5"/></svg><span>This period</span></a>
      <a href="#/bills" data-view="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Bills</span></a>
      <a href="#/income" data-view="income"><svg viewBox="0 0 24 24"><path d="M12 3v18M17 7H9.5a2.5 2.5 0 000 5h5a2.5 2.5 0 010 5H6"/></svg><span>Income</span></a>
      <a href="#/settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></a>
      <div class="nav-user" id="nav-user"></div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div id="modal-body"></div>
      <p class="form-error" id="modal-error" role="alert"></p>
      <footer id="modal-actions"></footer>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
