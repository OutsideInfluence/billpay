services:
  billpay:
    build: .
    image: billpay:latest
    container_name: billpay
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      # Set to 1 once you serve the app over HTTPS so the login cookie is never sent unencrypted.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      # Set to 1 only when running behind a reverse proxy, so lockouts use the real client IP.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Optional. If unset, a random key is generated and stored in the data volume.
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - billpay-data:/data

volumes:
  billpay-data:
